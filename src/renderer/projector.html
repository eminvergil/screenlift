<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src * blob: mediastream:">
<title>ScreenLift — Projector</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; }
  #hint { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); padding: 12px 20px; border-radius: 10px;
    background: rgba(20,22,32,.85); color: #ddd; font: 16px -apple-system, "Segoe UI", sans-serif; transition: opacity .6s; }
  #hint.hide { opacity: 0; }
</style>
</head>
<body>
<video id="video" autoplay muted playsinline></video>
<div id="hint">Press Esc to close</div>
<script src="projector.js"></script>
</body>
</html>
