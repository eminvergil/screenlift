<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="100" y1="100" x2="924" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5468ff"/>
      <stop offset="1" stop-color="#a35cff"/>
    </linearGradient>
    <radialGradient id="gloss" cx="300" cy="180" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2463"/>
      <stop offset="1" stop-color="#3a2a8c"/>
    </linearGradient>
    <linearGradient id="content" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fa0ff"/>
      <stop offset="1" stop-color="#d08bff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Zemin -->
  <rect x="100" y="114" width="824" height="824" rx="185" fill="#1a1040" fill-opacity=".35" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>

  <g transform="translate(14 44)">
    <!-- Dizüstünün çevresinde TV'den boşluk kes (temiz katman ayrımı) -->
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <rect x="176" y="484" width="318" height="216" rx="30" fill="#000" stroke="#000" stroke-width="52"/>
      <rect x="140" y="696" width="390" height="40" rx="20" fill="#000" stroke="#000" stroke-width="44"/>
    </mask>

    <!-- Televizyon -->
    <g mask="url(#cut)">
      <rect x="566" y="572" width="96" height="44" fill="#ffffff"/>
      <rect x="492" y="606" width="244" height="30" rx="15" fill="#ffffff"/>
      <rect x="330" y="236" width="520" height="350" rx="46" fill="#ffffff"/>
      <rect x="364" y="270" width="452" height="282" rx="22" fill="url(#screen)"/>
      <rect x="430" y="322" width="250" height="168" rx="16" fill="url(#content)"/>
      <rect x="430" y="322" width="250" height="34" rx="16" fill="#ffffff" fill-opacity=".35"/>
    </g>

    <!-- Dizüstü bilgisayar (önde) -->
    <rect x="176" y="484" width="318" height="216" rx="30" fill="#ffffff"/>
    <rect x="200" y="508" width="270" height="168" rx="12" fill="url(#screen)"/>
    <rect x="238" y="538" width="150" height="101" rx="10" fill="url(#content)"/>
    <rect x="238" y="538" width="150" height="21" rx="10" fill="#ffffff" fill-opacity=".35"/>
    <rect x="140" y="696" width="390" height="40" rx="20" fill="#ffffff"/>
  </g>
</svg>
